version: '3'

tasks:
  docs:validate:
    desc: Validate the OpenAPI specification
    cmds:
      - cd "{{.ROOT_DIR}}/src/backend" && npm run docs:validate

  docs:test:
    desc: Run documentation tests
    cmds:
      - cd "{{.ROOT_DIR}}/src/backend" && NODE_OPTIONS=--experimental-vm-modules NODE_ENV=testing npx jest --no-coverage --testPathPatterns='apiDocs'

  docs:check:
    desc: Run all documentation checks
    deps:
      - docs:validate
      - docs:test
