version: '3'

vars:
  INTEGRATION_TEST_PATTERN: '\.integration\.test\.js$'

tasks:
  test:
    desc: Run the standard backend test suite
    cmds:
      - cd "{{.ROOT_DIR}}/src/backend" && npm test

  test:unit:
    desc: Alias for the standard backend test suite
    cmds:
      - cd "{{.ROOT_DIR}}/src/backend" && npm test

  test:auth:
    desc: Run auth-related tests
    cmds:
      - cd "{{.ROOT_DIR}}/src/backend" && NODE_OPTIONS=--experimental-vm-modules NODE_ENV=testing npx jest --no-coverage --testPathPatterns='auth'

  test:refresh:
    desc: Run refresh-token tests
    cmds:
      - cd "{{.ROOT_DIR}}/src/backend" && NODE_OPTIONS=--experimental-vm-modules NODE_ENV=testing npx jest --no-coverage --testPathPatterns='refresh'

  test:logout:
    desc: Run logout tests
    cmds:
      - cd "{{.ROOT_DIR}}/src/backend" && NODE_OPTIONS=--experimental-vm-modules NODE_ENV=testing npx jest --no-coverage --testPathPatterns='logout'

  test:watch:
    desc: Run backend tests in watch mode
    interactive: true
    cmds:
      - cd "{{.ROOT_DIR}}/src/backend" && npm run test:watch

  test:integration:
    desc: Run all real-PostgreSQL integration tests
    env:
      POSTGRES_TEST_USER: '{{.POSTGRES_TEST_USER}}'
      POSTGRES_TEST_PASSWORD: '{{.POSTGRES_TEST_PASSWORD}}'
      POSTGRES_TEST_DB: '{{.POSTGRES_TEST_DB}}'
      POSTGRES_TEST_HOST: '{{.POSTGRES_TEST_HOST}}'
      POSTGRES_TEST_PORT: '{{.POSTGRES_TEST_PORT}}'
      TEST_DATABASE_URL: '{{.TEST_DATABASE_URL}}'
    cmds:
      - |-
        {{.ROOT_DIR}}/build/scripts/testing/integration-env.sh npx jest --runInBand --testPathPatterns='{{.INTEGRATION_TEST_PATTERN}}' {{.JEST_ARGS}}

  test:integration-auth:
    desc: Run the HTTP logout route integration suite
    env:
      POSTGRES_TEST_USER: '{{.POSTGRES_TEST_USER}}'
      POSTGRES_TEST_PASSWORD: '{{.POSTGRES_TEST_PASSWORD}}'
      POSTGRES_TEST_DB: '{{.POSTGRES_TEST_DB}}'
      POSTGRES_TEST_HOST: '{{.POSTGRES_TEST_HOST}}'
      POSTGRES_TEST_PORT: '{{.POSTGRES_TEST_PORT}}'
      TEST_DATABASE_URL: '{{.TEST_DATABASE_URL}}'
    cmds:
      - |-
        {{.ROOT_DIR}}/build/scripts/testing/integration-env.sh npx jest --runInBand --testPathPatterns='auth\.logout\.route\.integration' {{.JEST_ARGS}}

  test:integration-refresh:
    desc: Run the refresh-token integration suite
    env:
      POSTGRES_TEST_USER: '{{.POSTGRES_TEST_USER}}'
      POSTGRES_TEST_PASSWORD: '{{.POSTGRES_TEST_PASSWORD}}'
      POSTGRES_TEST_DB: '{{.POSTGRES_TEST_DB}}'
      POSTGRES_TEST_HOST: '{{.POSTGRES_TEST_HOST}}'
      POSTGRES_TEST_PORT: '{{.POSTGRES_TEST_PORT}}'
      TEST_DATABASE_URL: '{{.TEST_DATABASE_URL}}'
    cmds:
      - |-
        {{.ROOT_DIR}}/build/scripts/testing/integration-env.sh npx jest --runInBand --testPathPatterns='auth\.service\.refresh\.integration' {{.JEST_ARGS}}

  test:integration-logout:
    desc: Run the logout integration suite
    env:
      POSTGRES_TEST_USER: '{{.POSTGRES_TEST_USER}}'
      POSTGRES_TEST_PASSWORD: '{{.POSTGRES_TEST_PASSWORD}}'
      POSTGRES_TEST_DB: '{{.POSTGRES_TEST_DB}}'
      POSTGRES_TEST_HOST: '{{.POSTGRES_TEST_HOST}}'
      POSTGRES_TEST_PORT: '{{.POSTGRES_TEST_PORT}}'
      TEST_DATABASE_URL: '{{.TEST_DATABASE_URL}}'
    cmds:
      - |-
        {{.ROOT_DIR}}/build/scripts/testing/integration-env.sh npx jest --runInBand --testPathPatterns='auth\.service\.logout\.integration' {{.JEST_ARGS}}
