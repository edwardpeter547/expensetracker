version: '3'

tasks:
  lint:
    desc: Lint the mobile app
    cmds:
      - cd "{{.ROOT_DIR}}/src/mobile" && npm run lint

  test:mobile:
    desc: Run mobile configuration and networking tests
    cmds:
      - cd "{{.ROOT_DIR}}/src/mobile" && npm test

  test:typecheck:
    desc: Type-check mobile unit tests with Node type definitions
    cmds:
      - cd "{{.ROOT_DIR}}/src/mobile" && npm run test:typecheck

  test:components:
    desc: Run mobile Jest component tests
    cmds:
      - cd "{{.ROOT_DIR}}/src/mobile" && npm run test:components

  backend:check:
    desc: Run backend quality checks
    deps:
      - test
      - prisma:validate
      - docs:validate
      - docs:test

  mobile:check:
    desc: Run mobile quality checks
    deps:
      - mobile:translate
      - lint
      - test:mobile
      - test:typecheck
      - test:components

  check:
    desc: Run backend + mobile quality checks
    deps:
      - backend:check
      - mobile:check
