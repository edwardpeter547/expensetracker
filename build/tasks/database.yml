version: '3'

tasks:
  db:up:
    desc: Start or create the local PostgreSQL container
    env:
      POSTGRES_TEST_USER: '{{.POSTGRES_TEST_USER}}'
      POSTGRES_TEST_PASSWORD: '{{.POSTGRES_TEST_PASSWORD}}'
      POSTGRES_TEST_DB: '{{.POSTGRES_TEST_DB}}'
      POSTGRES_TEST_HOST: '{{.POSTGRES_TEST_HOST}}'
      POSTGRES_TEST_PORT: '{{.POSTGRES_TEST_PORT}}'
      TEST_DATABASE_URL: '{{.TEST_DATABASE_URL}}'
    cmds:
      - "{{.ROOT_DIR}}/build/scripts/database/postgres.sh up"

  db:down:
    desc: Stop the PostgreSQL container (data kept)
    env:
      POSTGRES_TEST_USER: '{{.POSTGRES_TEST_USER}}'
      POSTGRES_TEST_PASSWORD: '{{.POSTGRES_TEST_PASSWORD}}'
      POSTGRES_TEST_DB: '{{.POSTGRES_TEST_DB}}'
      POSTGRES_TEST_HOST: '{{.POSTGRES_TEST_HOST}}'
      POSTGRES_TEST_PORT: '{{.POSTGRES_TEST_PORT}}'
      TEST_DATABASE_URL: '{{.TEST_DATABASE_URL}}'
    cmds:
      - "{{.ROOT_DIR}}/build/scripts/database/postgres.sh down"

  db:status:
    desc: Show PostgreSQL container and readiness state
    env:
      POSTGRES_TEST_USER: '{{.POSTGRES_TEST_USER}}'
      POSTGRES_TEST_PASSWORD: '{{.POSTGRES_TEST_PASSWORD}}'
      POSTGRES_TEST_DB: '{{.POSTGRES_TEST_DB}}'
      POSTGRES_TEST_HOST: '{{.POSTGRES_TEST_HOST}}'
      POSTGRES_TEST_PORT: '{{.POSTGRES_TEST_PORT}}'
      TEST_DATABASE_URL: '{{.TEST_DATABASE_URL}}'
    cmds:
      - "{{.ROOT_DIR}}/build/scripts/database/postgres.sh status"

  db:logs:
    desc: Tail PostgreSQL logs
    interactive: true
    env:
      POSTGRES_TEST_USER: '{{.POSTGRES_TEST_USER}}'
      POSTGRES_TEST_PASSWORD: '{{.POSTGRES_TEST_PASSWORD}}'
      POSTGRES_TEST_DB: '{{.POSTGRES_TEST_DB}}'
      POSTGRES_TEST_HOST: '{{.POSTGRES_TEST_HOST}}'
      POSTGRES_TEST_PORT: '{{.POSTGRES_TEST_PORT}}'
      TEST_DATABASE_URL: '{{.TEST_DATABASE_URL}}'
    cmds:
      - "{{.ROOT_DIR}}/build/scripts/database/postgres.sh logs"

  db:provision-test:
    desc: Ensure the dedicated test role exists (idempotent)
    env:
      POSTGRES_TEST_USER: '{{.POSTGRES_TEST_USER}}'
      POSTGRES_TEST_PASSWORD: '{{.POSTGRES_TEST_PASSWORD}}'
      POSTGRES_TEST_DB: '{{.POSTGRES_TEST_DB}}'
      POSTGRES_TEST_HOST: '{{.POSTGRES_TEST_HOST}}'
      POSTGRES_TEST_PORT: '{{.POSTGRES_TEST_PORT}}'
      TEST_DATABASE_URL: '{{.TEST_DATABASE_URL}}'
    cmds:
      - "{{.ROOT_DIR}}/build/scripts/database/postgres.sh provision-test"

  db:create-dev:
    desc: Idempotently provision the development database and roles
    env:
      POSTGRES_TEST_USER: '{{.POSTGRES_TEST_USER}}'
      POSTGRES_TEST_PASSWORD: '{{.POSTGRES_TEST_PASSWORD}}'
      POSTGRES_TEST_DB: '{{.POSTGRES_TEST_DB}}'
      POSTGRES_TEST_HOST: '{{.POSTGRES_TEST_HOST}}'
      POSTGRES_TEST_PORT: '{{.POSTGRES_TEST_PORT}}'
      POSTGRES_DEV_DB: '{{.POSTGRES_DEV_DB}}'
      POSTGRES_DEV_USER: '{{.POSTGRES_DEV_USER}}'
      POSTGRES_DEV_PASSWORD: '{{.POSTGRES_DEV_PASSWORD}}'
      POSTGRES_MIGRATE_USER: '{{.POSTGRES_MIGRATE_USER}}'
      POSTGRES_MIGRATE_PASSWORD: '{{.POSTGRES_MIGRATE_PASSWORD}}'
    cmds:
      - "{{.ROOT_DIR}}/build/scripts/database/postgres.sh create-dev"
